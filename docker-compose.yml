name: lumen

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lumen-api
    env_file: .env
    environment:
      OLLAMA_HOST: http://ollama:11434
      LUMEN_LANCEDB_PATH: /data/lancedb
      HF_HOME: /models/hf
    ports:
      - "${LUMEN_API_PORT:-8000}:8000"
    volumes:
      - ${LUMEN_DATA_DIR:-./data}:/data
      - ${LUMEN_MODELS_DIR:-./models}:/models
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lumen-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_INTERNAL_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: lumen-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    # Uncomment for GPU
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  ollama_data:
