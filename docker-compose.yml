name: folio

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: folio-api
    env_file: .env
    environment:
      OLLAMA_HOST: http://ollama:11434
      FOLIO_DOCLING_HOST: http://docling:5001
      FOLIO_LANCEDB_PATH: /data/lancedb
      HF_HOME: /models/hf
    ports:
      - "${FOLIO_API_PORT:-8000}:8000"
    volumes:
      - ${FOLIO_DATA_DIR:-./data}:/data
      - ${FOLIO_MODELS_DIR:-./models}:/models
    depends_on:
      ollama:
        condition: service_healthy
      docling:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  docling:
    # CPU image by default. For GPU, run with `--profile gpu` and swap in the
    # cu124 variant (see the gpu profile below). Pin a specific tag for
    # reproducibility before you ship.
    image: quay.io/docling-project/docling-serve-cpu:latest
    container_name: folio-docling
    environment:
      DOCLING_SERVE_ENABLE_UI: "false"
    ports:
      - "5001:5001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5001/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  docling-gpu:
    profiles: ["gpu"]
    image: quay.io/docling-project/docling-serve-cu124:latest
    container_name: folio-docling-gpu
    environment:
      DOCLING_SERVE_ENABLE_UI: "false"
    ports:
      - "5001:5001"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: folio-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_INTERNAL_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: folio-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    # Uncomment for GPU
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  ollama_data:
