[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "folio-rag"
version = "0.0.1"
description = "Local-first, open-source RAG for PDFs and the web."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Folio contributors" }]
keywords = ["rag", "retrieval", "llm", "embeddings", "pdf", "ollama", "lancedb"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.9",
    "pyyaml>=6.0",
    "sse-starlette>=2.1",
    "sentence-transformers>=3.2",
    "lancedb>=0.14",
    "pyarrow>=17.0",
    "bm25s>=0.2",
    "numpy>=1.26,<3",
    "python-multipart>=0.0.12",
    "aiofiles>=24.1",
    "tenacity>=9.0",
    "structlog>=24.4",
    "trafilatura>=1.12",
    "markdown-it-py>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "httpx>=0.27",
    "respx>=0.21",
    "ragas>=0.2",
]
gpu = [
    "torch>=2.4",
]

[project.scripts]
folio = "app.cli:app"

[project.urls]
Homepage = "https://github.com/Musthakeem98/folio-rag"
Issues = "https://github.com/Musthakeem98/folio-rag/issues"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "TID", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
