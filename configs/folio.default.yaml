# Folio default configuration.
# Override via env vars (FOLIO_*) or by passing --config to the CLI.

ingest:
  parser:
    name: docling
    options:
      extract_tables: true
      extract_figures: true
      ocr: auto           # auto | always | never
  chunker:
    name: markdown_structural
    options:
      target_tokens: 512
      overlap_tokens: 64
      preserve_tables: true

embed:
  provider: sentence_transformers
  model: BAAI/bge-m3
  device: cpu             # cpu | cuda | mps
  batch_size: 32
  normalize: true

store:
  backend: lancedb
  path: /data/lancedb
  table: documents
  index:
    metric: cosine
    num_partitions: 256
    num_sub_vectors: 16

retrieve:
  dense:
    top_k: 50
  sparse:
    enabled: true
    backend: bm25s
    top_k: 50
  fusion:
    method: rrf
    k: 60
  rerank:
    enabled: true
    provider: sentence_transformers
    model: BAAI/bge-reranker-v2-m3
    top_k: 5

generate:
  provider: ollama
  model: qwen2.5:7b-instruct
  temperature: 0.2
  max_tokens: 1024
  system_prompt: |
    You are a careful assistant. Answer using ONLY the provided context.
    Cite every claim with its source id in square brackets, like [doc_12#p3].
    If the context does not contain the answer, say so.

eval:
  golden_set: ./data/golden/qa.jsonl
  metrics:
    - recall_at_k
    - ndcg
    - faithfulness
    - citation_precision
  judge:
    provider: ollama
    model: qwen2.5:7b-instruct
